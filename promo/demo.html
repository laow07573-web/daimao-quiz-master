<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫卷 · 录屏演示（本地版）</title>
<!--
  猫卷 · 宣发录屏页（本地文件版）· 品牌片结构
  ─────────────────────────────
  双击本文件即可打开（file:// 本地协议，零网络依赖、零外部资源）。
  打开后 3-2-1 倒计时自动播放，播完自动循环，适合先点录制再等它开播。

  叙事结构（14 拍约 80 秒）：
    序章  为什么做猫卷（备考之难 · 三个老问题）
    第一章 开发历程时间轴（2026.06.15 动工 → 三模式 → 42 项修复 →
           加密封存 → 环境重建 → 更名猫卷 → v1.27 → v1.28）
    第二章 今天的功能（新生引导 · 免 Key 解析 · AI · 追问 · 数据）
    尾声  数字与下载

  参数（加在文件路径后面，如 demo.html?ar=16:9&speed=1.2&from=6&go=1）：
    ar=9:16      画面比例：9:16（默认竖屏）/ 16:9 / 3:4 / 1:1
    speed=1.2    全局速度倍率
    from=6       从第 N 拍开始循环（只录功能段用 from=6）
    go=1         跳过 3-2-1 倒计时立即开播

  快捷键：空格 暂停/继续 · R 重播 · F 全屏 · ←→ 上一拍/下一拍
-->
<style>
  :root{
    --acc:#2563EB; --acc2:#5B9BFF; --acc3:#8FB6FF;
    --ink:#080E1C; --ink2:#0D1730;
    --tx:#F3F6FC; --tx2:#A9BAD8; --tx3:#5D6E8E;
    --m-bg:#F5F7FA; --m-card:#FFFFFF; --m-bd:#E2E8F0; --m-fg:#111827; --m-fg2:#566072; --m-fg3:#8A94A6;
    --m-s2:#EDF1F7; --m-ok:#15803D; --m-okbg:#DCFCE7; --m-bad:#B91C1C; --m-badbg:#FEE2E2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 700px at 16% 10%, rgba(37,99,235,.20), transparent 62%),
      radial-gradient(950px 650px at 86% 88%, rgba(99,102,241,.16), transparent 62%),
      radial-gradient(640px 420px at 80% 6%, rgba(14,165,164,.10), transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
    color:var(--tx); overflow:hidden; cursor:none;
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  /* 背景缓移光斑（录制时画面有呼吸感） */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;
    animation:drift 26s ease-in-out infinite alternate}
  .blob.b1{width:44vmax;height:44vmax;left:-12vmax;top:-16vmax;background:rgba(37,99,235,.34)}
  .blob.b2{width:38vmax;height:38vmax;right:-14vmax;bottom:-14vmax;background:rgba(99,102,241,.30);animation-delay:-9s}
  .blob.b3{width:26vmax;height:26vmax;right:8vmax;top:-10vmax;background:rgba(13,148,136,.20);animation-delay:-17s}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(4vmax,3vmax) scale(1.08)}
    100%{transform:translate(-3vmax,4vmax) scale(.95)}
  }
  /* ───── 舞台 ───── */
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    transform-origin:center center;display:flex;flex-direction:column;align-items:center}
  .brand{width:100%;display:flex;align-items:center;gap:12px;position:relative;z-index:40}
  .brand .lg{border-radius:22%;background:linear-gradient(135deg,#2E6BFF,#1D4ED8);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;
    box-shadow:0 8px 24px rgba(37,99,235,.45)}
  .brand b{letter-spacing:.06em}
  .brand .sp{flex:1}
  .brand .ver{color:var(--tx2);border:1px solid rgba(157,176,208,.30);border-radius:999px}
  .mid{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
  /* 竖屏：手机在上字幕在下；横屏：手机在左字幕在右 */
  [data-lay="port"] .mid{flex-direction:column;gap:3.2%}
  [data-lay="land"] .mid{flex-direction:row;gap:5.5%}
  /* ───── 手机 ───── */
  .phone{position:relative;flex:0 0 auto;border-radius:9.2% / 4.3%;
    background:linear-gradient(160deg,#2C3856,#131C33 55%,#243153);
    box-shadow:0 42px 110px rgba(2,6,18,.8), 0 0 0 1px rgba(255,255,255,.07), 0 0 120px rgba(37,99,235,.22)}
  .phone::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 32%)}
  .scr{position:absolute;border-radius:8%/3.8%;overflow:hidden;background:var(--m-bg);color:var(--m-fg)}
  .notch{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);width:26%;height:2.6%;
    background:#0B1220;border-radius:999px;z-index:40}
  /* 屏内通用件 */
  .sbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;font-weight:600;color:var(--m-fg)}
  .sbar .r{display:flex;gap:4px;align-items:center}
  .sg{width:14px;height:10px;background:var(--m-fg);clip-path:polygon(0 100%,100% 0,100% 100%);opacity:.9}
  .bat{width:20px;height:10px;border:1.4px solid var(--m-fg);border-radius:3px;position:relative;opacity:.9}
  .bat::before{content:"";position:absolute;inset:1.6px;right:5px;background:var(--m-fg);border-radius:1px}
  .bat::after{content:"";position:absolute;right:-3.4px;top:2.4px;width:2px;height:4px;background:var(--m-fg);border-radius:0 2px 2px 0}
  .appb{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:17px;font-weight:800}
  .appb .sp{flex:1}
  .gear{width:26px;height:26px;border-radius:8px;background:var(--m-s2);display:flex;align-items:center;justify-content:center;color:var(--m-fg2)}
  .prog{height:3px;background:var(--m-s2);margin:0 14px;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
  .body{position:absolute;top:70px;bottom:52px;left:0;right:0;overflow:hidden;padding:10px 14px 0}
  .navb{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--m-card);
    border-top:1px solid var(--m-bd);display:flex;align-items:center;justify-content:space-around;font-size:10.5px;color:var(--m-fg3)}
  .navb .t{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
  .navb .t.on{color:var(--acc);font-weight:700}
  .navb .pip{width:26px;height:3px;border-radius:2px;background:transparent;margin-top:1px}
  .navb .t.on .pip{background:var(--acc)}
  .card{background:var(--m-card);border:1px solid var(--m-bd);border-radius:14px;padding:13px}
  .hero{background:linear-gradient(135deg,#2E6BFF,#1D4ED8);border-radius:16px;color:#fff;
    padding:16px 16px 14px;box-shadow:0 10px 24px rgba(37,99,235,.35)}
  .hero .hi{font-size:16px;font-weight:800}
  .hero .hr{display:flex;align-items:center;gap:10px;margin-top:12px}
  .hero .lg2{width:38px;height:38px;border-radius:10px;background:#fff;color:#1D4ED8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .hero .ht{font-size:14px;font-weight:800}
  .hero .hq{font-size:11.5px;opacity:.85;margin-top:1px}
  .sech{font-size:13.5px;font-weight:800;margin:14px 2px 8px;color:var(--m-fg)}
  .qa{display:flex;flex-direction:column;gap:9px}
  .qi{display:flex;align-items:center;gap:10px;background:var(--m-card);border:1px solid var(--m-bd);border-radius:13px;padding:11px 12px}
  .qi.hl{border:1.5px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 4px 16px rgba(37,99,235,.16)}
  .qi .ic{width:36px;height:36px;border-radius:10px;background:rgba(37,99,235,.1);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .qi .tx{flex:1;min-width:0}
  .qi .tx b{font-size:13.5px;display:block}
  .qi .tx em{font-style:normal;font-size:11px;color:var(--m-fg2);display:block;margin-top:2px;line-height:1.45}
  .qi .go{font-size:12px;font-weight:700;color:var(--m-fg3)}
  .qi .btn{background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;border-radius:11px;padding:7px 14px}
  .qtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--acc);background:#E4EDFE;border-radius:7px;padding:3px 8px}
  .qmeta{font-size:10px;color:var(--m-fg3);margin-left:7px}
  .stem{font-size:14.5px;line-height:1.6;margin-top:8px;font-weight:600}
  .tf{display:flex;gap:10px;margin-top:12px}
  .tf .b{flex:1;background:var(--m-card);border:1.5px solid #16A34A;border-radius:13px;padding:14px 0;text-align:center;font-size:15px;font-weight:800;color:#15803D}
  .tf .b.x{border-color:#DC2626;color:#B91C1C}
  .fb{margin-top:11px;background:var(--m-badbg);border:1.5px solid #DC2626;border-radius:14px;padding:12px 13px;opacity:0;transform:translateY(10px);transition:all .45s cubic-bezier(.22,1,.36,1)}
  .fb.on{opacity:1;transform:none}
  .fb .tt{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--m-bad)}
  .fb .rr{font-size:12.5px;margin-top:6px;color:var(--m-fg2)}
  .fb .rr b{color:#15803D}
  .aih{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--acc)}
  .aih .sp{flex:1}
  .aih .mini{font-size:10px;font-weight:600;color:var(--m-fg3);background:var(--m-s2);padding:3px 8px;border-radius:999px}
  .atext{font-size:12.8px;line-height:1.75;color:var(--m-fg);margin-top:8px}
  .atext .hl{color:var(--acc);font-weight:700}
  .caret{display:inline-block;width:2px;height:14px;background:var(--acc);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .askrow{display:flex;align-items:center;gap:10px;background:var(--m-card);border:1px solid var(--m-bd);border-radius:13px;padding:11px 12px;margin-top:10px}
  .askrow .aic{width:32px;height:32px;border-radius:9px;background:rgba(37,99,235,.1);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .askrow .tx b{font-size:13px;display:block}
  .askrow .tx em{font-style:normal;font-size:11px;color:var(--m-fg2)}
  .heat{display:grid;grid-template-columns:repeat(13,1fr);gap:3.5px;margin-top:10px}
  .heat i{aspect-ratio:1;border-radius:3px;background:#E7ECF4}
  .heat i.l1{background:#BFD5FA}.heat i.l2{background:#6E9EF6}.heat i.l3{background:#2563EB}
  .trio{display:flex;gap:9px;margin-top:10px}
  .trio>div{flex:1;background:var(--m-card);border:1px solid var(--m-bd);border-radius:12px;text-align:center;padding:10px 4px}
  .trio b{font-size:15px;display:block}
  .trio em{font-style:normal;font-size:9.5px;color:var(--m-fg2)}
  .toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-16px);opacity:0;
    background:rgba(17,24,39,.92);color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:999px;white-space:nowrap;transition:all .4s cubic-bezier(.22,1,.36,1);
    box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:5}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .tap{position:absolute;width:46px;height:46px;border-radius:50%;pointer-events:none;z-index:9;
    border:2.5px solid rgba(37,99,235,.85);background:rgba(37,99,235,.18);
    transform:translate(-50%,-50%) scale(.4);opacity:0}
  .tap.on{animation:tap 1.15s ease-out infinite}
  @keyframes tap{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
    25%{opacity:1}
    70%{opacity:.9;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}
  }
  .layer{position:absolute;inset:0;opacity:0;transform:translateX(5%);pointer-events:none;
    transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1)}
  .layer.on{opacity:1;transform:none;pointer-events:auto}
  /* 屏内内容一律按 276×613 设计稿绘制，再等比缩放进手机屏（与推广页 mroot 同思路） */
  .fitbox{position:absolute;top:0;left:0;width:276px;height:613px;transform-origin:top left}
  /* 开场/结尾大卡 */
  .bigcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .bigcard .lg3{width:96px;height:96px;border-radius:27%;background:linear-gradient(135deg,#2E6BFF,#1D4ED8);
    display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#fff;
    box-shadow:0 22px 70px rgba(37,99,235,.55)}
  .bigcard h1{font-size:31px;font-weight:800;letter-spacing:.04em}
  .bigcard .sl{font-size:14px;color:var(--m-fg2);line-height:1.75}
  .url{font-weight:800;color:#1D4ED8;letter-spacing:.01em;background:#EAF0FE;
    border:1.5px solid color-mix(in srgb,var(--acc) 40%,transparent);padding:12px 18px;border-radius:14px;line-height:1.5}
  /* ───── 字幕 ───── */
  .caps{position:relative;width:100%;z-index:40}
  [data-lay="port"] .caps{flex:0 0 21%}
  [data-lay="land"] .caps{flex:1;align-self:stretch;margin-left:1%}
  .cap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;opacity:0;transform:translateY(14px);transition:all .45s cubic-bezier(.22,1,.36,1);pointer-events:none}
  [data-lay="land"] .cap{align-items:flex-start;text-align:left;gap:16px}
  .cap.on{opacity:1;transform:none;pointer-events:auto}
  .cap .k{font-weight:800;letter-spacing:.32em;color:var(--acc3);text-indent:.32em}
  .cap h1{font-weight:900;line-height:1.32;text-shadow:0 2px 30px rgba(37,99,235,.4)}
  .cap h1 .w{display:inline-block;opacity:0;transform:translateY(.55em) scale(.86);filter:blur(3px)}
  .cap.on h1 .w{animation:wpop .5s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--i) * 45ms)}
  @keyframes wpop{to{opacity:1;transform:none;filter:none}}
  .cap h1 .em .w{color:var(--acc2)}
  .cap p{color:var(--tx2);line-height:1.65}
  .cap p .chip{display:inline-block;margin:0 4px;padding:.28em .8em;border:1px solid rgba(157,176,208,.32);
    border-radius:999px;color:var(--tx2)}
  /* 进度段 */
  .segs{width:100%;display:flex;gap:6px;position:relative;z-index:40}
  .segs i{flex:1;height:4px;border-radius:3px;background:rgba(157,176,208,.22);overflow:hidden;position:relative}
  .segs i.done{background:var(--acc2)}
  .segs i b{position:absolute;inset:0;background:var(--acc2);transform-origin:left;transform:scaleX(0);border-radius:3px}
  /* 倒计时 */
  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90}
  #count i{position:absolute;font-style:normal;font-weight:900;color:var(--acc2);
    text-shadow:0 0 60px rgba(37,99,235,.65);animation:cnum 1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes cnum{0%{opacity:0;transform:scale(1.9);filter:blur(10px)}22%{opacity:1;transform:scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
  /* 暂停徽标 */
  #pausebd{position:fixed;left:50%;bottom:4.5%;transform:translateX(-50%);z-index:80;
    font-size:13px;letter-spacing:.2em;color:var(--tx2);border:1px solid rgba(157,176,208,.4);
    border-radius:999px;padding:.45em 1.2em;opacity:0;transition:opacity .25s;pointer-events:none}
  #pausebd.on{opacity:1}
  /* ───── 影片层：叙事拍覆盖全舞台，手机在毛玻璃后隐去 ───── */
  .film{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(8,14,28,.60),rgba(8,14,28,.88));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transform:scale(1.035);transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
  .film.on{opacity:1;transform:none}
  .filmbox{width:80%;max-height:88%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.8%;text-align:center}
  .pcard{width:100%;text-align:left;background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(99,102,241,.12));
    border:1px solid rgba(91,155,255,.30);border-radius:14px;padding:3.4% 4.2%;
    opacity:0;transform:translateY(20px);transition:all .55s cubic-bezier(.22,1,.36,1)}
  .pcard.in{opacity:1;transform:none}
  .pcard b{display:block;font-size:17px;color:#fff}
  .pcard b i{font-style:normal;color:var(--acc2)}
  .pcard em{font-style:normal;font-size:12.5px;color:var(--tx2);display:block;margin-top:3px;line-height:1.5}
  .pfoot{font-size:15.5px;font-weight:700;color:var(--tx);opacity:0;transform:translateY(10px);transition:all .55s .1s}
  .pfoot.in{opacity:1;transform:none}
  .pfoot i{font-style:normal;color:var(--acc2)}
  /* 时间轴 */
  .tl{position:relative;width:90%;text-align:left}
  .tl .line{position:absolute;left:7px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,var(--acc2),rgba(91,155,255,.12));
    transform:scaleY(0);transform-origin:top;transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
  .tl.on .line{transform:scaleY(1)}
  .tli{position:relative;padding:0 0 5% 30px;opacity:0;transform:translateX(-16px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.22,1,.36,1)}
  .tli.in{opacity:1;transform:none}
  .tli::before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;
    background:var(--ink2);border:2.5px solid var(--acc2);box-shadow:0 0 16px rgba(91,155,255,.55)}
  .tli .d{font-size:11.5px;color:var(--acc3);letter-spacing:.08em;font-weight:700}
  .tli .v{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;color:#fff;
    background:rgba(37,99,235,.4);border:1px solid rgba(91,155,255,.4);padding:2px 9px;border-radius:999px;vertical-align:1px}
  .tli p{font-size:14.5px;color:var(--tx);line-height:1.55;margin-top:3px}
  .tli p b{color:var(--acc2)}
  /* 数字卡 */
  .stats{display:flex;gap:5%;width:100%;justify-content:center}
  .stat{flex:1;background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(99,102,241,.12));
    border:1px solid rgba(91,155,255,.30);border-radius:16px;padding:5.5% 2%;text-align:center;
    opacity:0;transform:translateY(20px);transition:all .55s cubic-bezier(.22,1,.36,1)}
  .stat.in{opacity:1;transform:none}
  .stat b{font-size:46px;font-weight:900;color:var(--acc2);text-shadow:0 0 34px rgba(37,99,235,.5)}
  .stat b s{text-decoration:none;font-size:19px;margin-left:2px;color:var(--tx)}
  .stat em{font-style:normal;display:block;font-size:12.5px;color:var(--tx2);margin-top:6px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="stage">
  <div class="brand">
    <div class="lg" style="width:34px;height:34px;font-size:19px">猫</div>
    <b style="font-size:19px">猫卷</b><span class="sp"></span>
    <span class="ver" style="font-size:12px;padding:4px 10px" id="ver">v1.28.1</span>
  </div>
  <div class="mid">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="scr" id="scr">
        <div class="toast" id="toast">示例题库导入完成 · 共 10 道题</div>
        <div class="tap" id="tap"></div>
      </div>
    </div>
    <div class="caps" id="caps"></div>
  </div>
  <div class="segs" id="segs"></div>
</div>
<div id="count"></div>
<div id="pausebd">‖ 已暂停 · 空格继续</div>

/* ════════════════ 画面比例与布局 ════════════════ */

function buildCaption(b){
  var c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = '<div class="k" style="font-size:' + (12 * U) + 'px">' + b.k + '</div>';
  if(b.h){
    var h = document.createElement('h1');
    h.style.fontSize = (LAY === 'port' ? 31 : 30) * Math.max(U, 1) + 'px';
    var parts = b.h.split('|');           // 奇数段为强调色
    var wi = 0;
    parts.forEach(function(part, pi){
      var span = document.createElement('span');
      if(pi % 2) span.className = 'em';
      part.split('').forEach(function(ch){
        var w = document.createElement('span');
        w.className = 'w'; w.style.setProperty('--i', wi++);
        w.textContent = ch;
        span.appendChild(w);
      });
      h.appendChild(span);
    });
    c.appendChild(h);
  }
  if(b.p){
    var p = document.createElement('p');
    p.style.fontSize = (LAY === 'port' ? 15 : 14.5) * Math.max(U, 1) + 'px';
    p.innerHTML = b.p.replace(/\[([^\]]+)\]/g, '<span class="chip">$1</span>');
    c.appendChild(p);
  }
  return c;
}

  if(!el){ tapEl.classList.remove('on'); return; }
  var x = 0, y = 0, n = el;
  while(n && n !== scrEl){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  var s = Math.min(scrEl.clientWidth / 276, scrEl.clientHeight / 613);
  tapEl.style.width = tapEl.style.height = (46 * s) + 'px';
  tapEl.style.borderWidth = Math.max(1.5, 2.5 * s) + 'px';
  tapEl.style.left = (x * s + el.offsetWidth * s / 2) + 'px';
  tapEl.style.top = (y * s + el.offsetHeight * s / 2) + 'px';
  tapEl.classList.remove('on');
  void tapEl.offsetWidth;
  tapEl.classList.add('on');
}
function bigLayer(html){
  var d = document.createElement('div');
  d.className = 'layer';
  d.innerHTML = '<div class="bigcard">' + html + '</div>';
  return d;
}
function clearType(){ TYPE_TIMERS.forEach(clearTimeout); TYPE_TIMERS = []; }
function typeInto(el, text, ms){
  var i = 0, step = Math.max(14, ms / text.length);
  (function tick(){
    if(i >= text.length){ el.innerHTML = renderAi(text); return; }
    i += 2;
    el.innerHTML = renderAi(text.slice(0, i)) + '<span class="caret"></span>';
    TYPE_TIMERS.push(setTimeout(tick, step));
  })();
}
function playBubs(box){
  BUBS.forEach(function(b, i){
    TYPE_TIMERS.push(setTimeout(function(){
      var d = document.createElement('div');
      d.style.cssText = 'max-width:82%;font-size:12px;line-height:1.6;padding:9px 12px;border-radius:' +
        (b.u ? '13px 13px 13px 4px;align-self:flex-end;background:var(--acc);color:#fff'
             : '13px 13px 4px 13px;align-self:flex-start;background:var(--m-card);border:1px solid var(--m-bd);color:var(--m-fg)');
      d.innerHTML = b.t;
      d.style.opacity = '0'; d.style.transform = 'translateY(8px)'; d.style.transition = 'all .4s';
      box.appendChild(d);
      requestAnimationFrame(function(){ d.style.opacity = '1'; d.style.transform = 'none'; });
    }, i * 1300 + 500));
  });
}
function clearLayers(){
  [].slice.call(scrEl.querySelectorAll('.layer')).forEach(function(l){ l.remove(); });
  clearType();
}
/* 把 276×613 设计稿等比缩放进当前手机屏 */
function fitLayer(l){
  var box = l.querySelector('.fitbox');
  if(!box) return;
  var s = Math.min(scrEl.clientWidth / 276, scrEl.clientHeight / 613);
  box.style.transform = 'scale(' + s + ')';
}

/* ════════════════ 影片层（叙事拍） ════════════════ */
var FILM_TOKEN = 0;
function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function emify(s){ return esc(s).replace(/\|(.+?)\|/g, '<i>$1</i>'); }
function clearFilm(){
  FILM_TOKEN++;
  [].slice.call(stage.querySelectorAll('.film')).forEach(function(f){ f.remove(); });
}
function filmContent(b){
  if(b.film === 'pains'){
    return b.pains.map(function(c){
      return '<div class="pcard"><b>' + emify(c.b) + '</b><em>' + esc(c.e) + '</em></div>';
    }).join('') + '<div class="pfoot">' + emify(b.foot) + '</div>';
  }
  if(b.film === 'timeline' || b.kind === 'timeline'){
    return '<div class="tl"><div class="line"></div>' + b.items.map(function(it){
      return '<div class="tli"><span class="d">' + esc(it.d) + '</span><span class="v">' + esc(it.v) + '</span><p>' + esc(it.t) + '</p></div>';
    }).join('') + '</div>';
  }
  if(b.film === 'now'){
    return '<div style="font-size:' + Math.round(84 * Math.max(U, 0.9)) + 'px;font-weight:900;color:var(--acc2);text-shadow:0 0 70px rgba(37,99,235,.65);letter-spacing:.02em">v1.28.1</div>' +
      '<div style="font-size:' + Math.round(13 * Math.max(U, 0.9)) + 'px;color:var(--tx2);letter-spacing:.34em;text-indent:.34em">TODAY · 2026.09</div>';
  }
  if(b.film === 'ask'){
    return '<div style="font-size:' + Math.round(150 * Math.max(U, 0.9)) + 'px;font-weight:900;color:rgba(91,155,255,.17);line-height:1;user-select:none">？</div>';
  }
  return '';
}
function countContent(b){
  return '<div class="stats">' + b.stats.map(function(s){
    return '<div class="stat"><b><span data-n="' + s.n + '">0</span><s>' + esc(s.s) + '</s></b><em>' + esc(s.label) + '</em></div>';
  }).join('') + '</div>' +
  '<div class="pfoot" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center">' +
    b.foot.replace(/\[([^\]]+)\]/g, '<span class="chip" style="font-size:12.5px;padding:.3em .9em;border:1px solid rgba(157,176,208,.32);border-radius:999px;color:var(--tx2)">$1</span>') +
  '</div>';
}
function mountFilm(inner){
  clearFilm();
  var f = document.createElement('div');
  f.className = 'film';
  f.innerHTML = '<div class="filmbox">' + inner + '</div>';
  stage.appendChild(f);
  var token = FILM_TOKEN;
  requestAnimationFrame(function(){
    if(token !== FILM_TOKEN) return;
    f.classList.add('on');
    var tl = f.querySelector('.tl');
    if(tl) TYPE_TIMERS.push(setTimeout(function(){ tl.classList.add('on'); }, 250));
    var rows = f.querySelectorAll('.pcard,.tli,.stat');
    var stepGap = f.querySelector('.tli') ? 560 : 430;
    rows.forEach(function(r, i){
      TYPE_TIMERS.push(setTimeout(function(){ r.classList.add('in'); }, i * stepGap + 380));
    });
    var pf = f.querySelector('.pfoot');
    if(pf) TYPE_TIMERS.push(setTimeout(function(){ pf.classList.add('in'); }, rows.length * stepGap + 760));
    /* 数字滚动（easeOutCubic） */
    var token2 = FILM_TOKEN;
    f.querySelectorAll('.stat span[data-n]').forEach(function(el){
      var n = +el.getAttribute('data-n'), t0 = performance.now();
      (function tick(){
        if(token2 !== FILM_TOKEN) return;
        var p = Math.min(1, (performance.now() - t0) / 1500);
        el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
        if(p < 1) requestAnimationFrame(tick);
      })();
    });
  });
  return f;
}

function showBeat(k){
  if(timer) clearTimeout(timer);
  beat = k;
  var b = BEATS[k];
  clearLayers();
  clearFilm();
  tapEl.classList.remove('on');
  toastEl.classList.remove('on');
  capEls.forEach(function(c, i){
    c.classList.remove('on');
    if(i === k){
      // 重启逐字动画：克隆替换
      var fresh = buildCaption(b);
      c.parentNode.replaceChild(fresh, c);
      capEls[i] = fresh;
      fresh.classList.add('on');
    }
  });
  segEls.forEach(function(s, i){
    s.classList.toggle('done', i < k);
    s.classList.toggle('cur', i === k);
    var f = s.querySelector('b'); if(f) f.remove();
  });
  segDur = b.ms / speed;

  if(b.film || b.kind === 'count' || b.kind === 'timeline'){
    /* 叙事拍：毛玻璃影片层盖住舞台，手机在后面隐去；字幕眉标+标题浮在其上 */
    mountFilm(b.kind === 'count' ? countContent(b) : filmContent(b));
  } else if(b.kind === 'title'){
    var t = bigLayer('<div class="lg3">猫</div><h1>猫卷 · 备考刷题</h1><div class="sl">为你，千千万万遍。</div>');
    scrEl.appendChild(t); fitLayer(t); requestAnimationFrame(function(){ t.classList.add('on'); });
  } else if(b.kind === 'end'){
    var e = bigLayer('<div class="lg3">猫</div><h1>猫卷 · 备考刷题</h1>' +
      '<div class="sl">免费 · 开源 · 数据全在本地</div>' +
      '<div class="url" style="font-size:13px">laow07573-web.github.io<br>daimao-quiz-master</div>');
    scrEl.appendChild(e); fitLayer(e); requestAnimationFrame(function(){ e.classList.add('on'); });
  } else {
    var l = document.createElement('div');
    l.className = 'layer';
    l.innerHTML = '<div class="fitbox">' + b.build() + '</div>';
    scrEl.insertBefore(l, toastEl);
    fitLayer(l);
    requestAnimationFrame(function(){ l.classList.add('on'); });
    if(b.toast) TYPE_TIMERS.push(setTimeout(function(){ toastEl.classList.add('on'); }, 900));
    if(b.type){
      var at = l.querySelector('#ai-typed');
      if(at) TYPE_TIMERS.push(setTimeout(function(){ typeInto(at, AI_TEXT, b.ms * 0.62 / speed); }, 500));
    }
    if(b.chat){
      var a0 = l.querySelector('#ai-typed');
      if(a0) a0.innerHTML = renderAi(AI_TEXT);
      var bx = l.querySelector('#bubs');
      if(bx) playBubs(bx);
    }
    if(b.pan){
      var body = l.querySelector('.body');
      if(body){
        body.style.transition = 'transform 5.2s cubic-bezier(.4,.1,.2,1)';
        body.style.transformOrigin = 'top center';
        TYPE_TIMERS.push(setTimeout(function(){ body.style.transform = 'scale(1.14) translateY(-14px)'; }, 700));
      }
    }
    if(b.tap) TYPE_TIMERS.push(setTimeout(function(){ showTap(b.tap); }, 500));
    if(b.revealFb) TYPE_TIMERS.push(setTimeout(function(){
      var f = l.querySelector('.fb'); if(f) f.classList.add('on');
    }, 2100));
  }

  /* 进度段填充 */
  segFill = document.createElement('b');
  segEls[k].appendChild(segFill);
  segStart = performance.now();
  (function drive(){
    if(segFill && segFill.parentNode){
      if(!paused){
        var p = Math.min(1, (performance.now() - segStart) / segDur);
        segFill.style.transform = 'scaleX(' + p + ')';
      }
      if(p < 1) requestAnimationFrame(drive);
    }
  })();

  timer = setTimeout(function(){ showBeat((k + 1) % BEATS.length); }, segDur + 350);
}

function setPaused(v){
  if(paused === v) return;
  paused = v;
  pauseBd.classList.toggle('on', v);
  if(v){ clearTimeout(timer); pausedAt = performance.now(); }
  else {
    var pd = performance.now() - pausedAt;
    segStart += pd;
    var rest = Math.max(300, segDur - (performance.now() - segStart));
    timer = setTimeout(function(){ showBeat((beat + 1) % BEATS.length); }, rest + 350);
  }
}

/* 倒计时后开播（?from=N 可从第 N 拍起循环） */
var SKIP = /go=1/.test(location.search);
var FROM = parseInt((location.search.match(/from=(\d+)/) || [])[1] || '0', 10);
FROM = Math.min(Math.max(FROM, 0), BEATS.length - 1);
function start(){
  countBox.innerHTML = '';
  if(SKIP){ showBeat(FROM); return; }
  var nums = ['3', '2', '1'];
  nums.forEach(function(n, i){
    var el = document.createElement('i');
    el.textContent = n;
    el.style.fontSize = '120px';
    el.style.animationDelay = (i * 0.95) + 's';
    el.style.opacity = '0';
    countBox.appendChild(el);
  });
  setTimeout(function(){ countBox.innerHTML = ''; showBeat(FROM); }, 2950);
}

window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); setPaused(!paused); }
  if(e.key === 'r' || e.key === 'R'){ paused = false; pauseBd.classList.remove('on'); showBeat(0); }
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  if(e.key === 'ArrowRight'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat + 1) % BEATS.length); }
  if(e.key === 'ArrowLeft'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat - 1 + BEATS.length) % BEATS.length); }
});
document.addEventListener('visibilitychange', function(){
  setPaused(document.hidden);
});

start();
</script>
