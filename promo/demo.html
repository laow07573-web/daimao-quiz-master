<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫卷 · 发布会（本地录屏版）</title>
<!--
  猫卷 · 产品发布会（本地录屏版 · 纯排版 / 两个版本）
  ═══════════════════════════════════════════════════
  双击即播（file:// 本地协议，零网络依赖；logo 内嵌单文件）。
  3-2-1 倒计时后自动开播，播完无缝循环。

  · 画面：深色舞台 + 巨幅排版 + 发丝分隔线 + 渐变强调字。不放手机模型。
  · 立体：透视相机（Z 推拉 / rotateX·Y 环绕），内容层与背景巨字层不同景深，
          转动时产生真实视差。
  · 丝滑：只动 transform/opacity，空闲帧零 DOM 写入（脏检查）。

  两个版本：
    demo.html             发布会版（慢，约 85 秒，14 拍）
    demo.html?cut=fast    短视频版（快，约 25 秒，9 拍，冲切更狠）

  参数：?ar=16:9 横版    ?speed=1.15 调速    ?go=1 跳倒计时    ?from=N 从第 N 拍起
  快捷键：空格 暂停 · R 重播 · F 全屏 · ←→ 逐拍
-->
<style>
  :root{
    --acc:#4F8DFF;
    --tx:#F5F8FF; --tx2:#9AA7BD; --tx3:#5C6C88;
    --line:rgba(255,255,255,.13);
    --bg:#080B12;
    --gr:linear-gradient(96deg,#4F8DFF 0%,#8B7BFF 50%,#22D3EE 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);overflow:hidden;cursor:none;
    font-family:-apple-system,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 46% at 12% 2%, rgba(79,141,255,.16), rgba(79,141,255,0) 68%),
      radial-gradient(52% 42% at 90% 100%, rgba(34,211,238,.11), rgba(34,211,238,0) 68%),
      radial-gradient(46% 38% at 86% 6%, rgba(139,123,255,.10), rgba(139,123,255,0) 70%)}
  #sheen{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden;contain:strict}
  #sheen .bar{position:absolute;top:-40%;bottom:-40%;width:30%;left:0;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.055),rgba(255,255,255,0));
    transform:translate3d(-140%,0,0) skewX(-16deg);will-change:transform}
  #sheen.go .bar{animation:sheen 1.5s cubic-bezier(.33,0,.2,1) 1}
  @keyframes sheen{from{transform:translate3d(-140%,0,0) skewX(-16deg)}to{transform:translate3d(440%,0,0) skewX(-16deg)}}
  #stage{position:absolute;left:50%;top:50%;transform:translate3d(-50%,-50%,0);
    transform-origin:center;display:flex;flex-direction:column;align-items:center;z-index:10;
    perspective:2000px;perspective-origin:50% 50%}
  .topbar{width:100%;display:flex;align-items:center;gap:11px;z-index:40}
  .topbar .lg{object-fit:contain}
  .topbar b{letter-spacing:.02em}
  .topbar .sp{flex:1}
  .topbar .cut{font-weight:800;letter-spacing:.3em;color:var(--tx3);text-transform:uppercase}
  #cam{position:relative;flex:1;width:100%;min-height:0;will-change:transform;
    transform-style:preserve-3d}
  #ghost{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    transform:translateZ(-340px) scale(1.19);pointer-events:none;
    font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap;
    color:rgba(255,255,255,.038);font-size:360px;
    opacity:0;transition:opacity .9s ease}
  #ghost.on{opacity:1}
  #textcam{position:absolute;inset:0;z-index:30;transform:translateZ(-96px) scale(1.048)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;will-change:transform,opacity,filter,clip-path;
    transition:opacity .62s ease, transform .8s cubic-bezier(.22,1,.36,1),
      filter .66s ease, clip-path .78s cubic-bezier(.66,0,.34,1)}
  /* ── 多变转场：每种一套「进来自哪 / 退出到哪」 ── */
  .scene.t-rise {transform:translate3d(0,16px,0)}   .scene.t-rise.out {transform:translate3d(0,-12px,0)}
  .scene.t-left {transform:translate3d(84px,0,0)}   .scene.t-left.out {transform:translate3d(-84px,0,0)}
  .scene.t-right{transform:translate3d(-84px,0,0)}  .scene.t-right.out{transform:translate3d(84px,0,0)}
  .scene.t-up   {transform:translate3d(0,78px,0)}   .scene.t-up.out   {transform:translate3d(0,-78px,0)}
  .scene.t-down {transform:translate3d(0,-78px,0)}  .scene.t-down.out {transform:translate3d(0,78px,0)}
  .scene.t-zoom {transform:scale(.84)}              .scene.t-zoom.out {transform:scale(1.08)}
  .scene.t-pull {transform:scale(1.16)}             .scene.t-pull.out {transform:scale(.9)}
  .scene.t-flip {transform:perspective(1200px) rotateY(-17deg) translateZ(-170px);transform-origin:50% 50%}
  .scene.t-flip.out{transform:perspective(1200px) rotateY(13deg) translateZ(-130px)}
  .scene.t-focus{filter:blur(13px);transform:scale(1.06)}  .scene.t-focus.out{filter:blur(13px);transform:scale(.97)}
  .scene.t-wipe {clip-path:inset(0 0 0 100%)}       .scene.t-wipe.out {clip-path:inset(0 100% 0 0)}
  .scene.t-iris {clip-path:circle(0% at 50% 50%)}   .scene.t-iris.out {clip-path:circle(0% at 50% 50%)}
  /* 落定态：必须排在所有变体之后以覆盖入场初值 */
  .scene.in{opacity:1;transform:none;filter:none}
  /* 需裁切的变体各自给落定形状（同形状才能平滑插值） */
  .scene.t-wipe.in{clip-path:inset(0 0 0 0)}
  .scene.t-iris.in{clip-path:circle(142% at 50% 50%)}
  .box{width:90%;max-height:94%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1em;text-align:center}
  .kick{font-weight:800;letter-spacing:.42em;text-indent:.42em;color:var(--acc);text-transform:uppercase}
  .h1{font-weight:900;line-height:1.08;letter-spacing:-.028em}
  .h1 .g{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mega{font-weight:900;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;
    background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--tx2);line-height:1.7}
  .foot{color:var(--tx3);font-weight:650;letter-spacing:.02em}
  .rise{opacity:0;transform:translate3d(0,18px,0);
    transition:opacity .68s ease, transform .78s cubic-bezier(.22,1,.36,1);will-change:transform,opacity}
  .rise.in{opacity:1;transform:none}
  .rows{width:100%;margin-top:1.05em}
  .row{display:flex;align-items:flex-start;gap:1.25em;text-align:left;padding:1.15em 0;border-top:1px solid var(--line)}
  .row:last-child{border-bottom:1px solid var(--line)}
  .row .no{font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;min-width:2.1em}
  .row .tx b{display:block;font-weight:800}
  .row .tx em{font-style:normal;color:var(--tx2);line-height:1.55}
  .tl{width:100%;text-align:left}
  .tl .lrow{display:flex;align-items:flex-start;gap:1.3em;padding:1.05em 0;border-top:1px solid var(--line)}
  .tl .lrow:last-child{border-bottom:1px solid var(--line)}
  .tl .when{min-width:6.6em;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.5em}
  .tl .when .pt{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 auto;box-shadow:0 0 12px var(--acc)}
  .tl .what b{display:block;font-weight:800}
  .tl .what em{font-style:normal;color:var(--tx2);line-height:1.5}
  .statrow{width:96%;text-align:left}
  .srow{display:flex;align-items:baseline;gap:1.15em;padding:1.35em 0;border-top:1px solid var(--line)}
  .srow:last-child{border-bottom:1px solid var(--line)}
  .srow .n{min-width:4.6em;font-weight:900;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
    background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
  .srow .n s{text-decoration:none}
  .srow .lb{color:var(--tx2)}
  .chips{display:flex;flex-wrap:wrap;gap:.6em;justify-content:center;margin-top:.2em}
  .chip{padding:.42em 1.05em;border:1px solid var(--line);border-radius:999px;color:var(--tx2);font-weight:700}
  .flow{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:.7em;margin-top:.5em}
  .flow .st{padding:.5em 1.1em;border:1px solid var(--line);border-radius:12px;font-weight:800;color:var(--tx)}
  .flow .ar{color:var(--acc);font-weight:900}
  .bars{width:100%;display:flex;flex-direction:column;gap:.7em;margin-top:.4em}
  .brow{display:flex;align-items:center;gap:1em}
  .brow .bl{min-width:4.2em;text-align:right;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}
  .brow .bt{flex:1;height:20px;border-radius:7px;background:rgba(255,255,255,.06);overflow:hidden}
  .brow .bt i{display:block;height:100%;border-radius:7px;background:var(--gr);transform-origin:left;transform:scaleX(0);
    transition:transform 1s cubic-bezier(.2,.8,.3,1);will-change:transform}
  .brow.on .bt i{transform:scaleX(var(--w))}
  .heat{display:grid;grid-template-columns:repeat(21,1fr);gap:6px;width:116%;margin-left:-8%;margin-top:.8em}
  .heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.055);
    transition:background .38s ease, box-shadow .38s ease}
  .heat i.l1{background:rgba(79,141,255,.34)}
  .heat i.l2{background:rgba(79,141,255,.62)}
  .heat i.l3{background:linear-gradient(135deg,#4F8DFF,#22D3EE)}
  .heatlegend{display:flex;align-items:center;gap:.5em;margin-top:1.1em;color:var(--tx3);
    font-size:1em;font-weight:650}
  .heatlegend i{width:15px;height:15px;border-radius:3px;background:rgba(255,255,255,.055)}
  .heatlegend i.lv1{background:rgba(79,141,255,.34)}
  .heatlegend i.lv2{background:rgba(79,141,255,.62)}
  .heatlegend i.lv3{background:linear-gradient(135deg,#4F8DFF,#22D3EE)}
  .heatlegend .sp{flex:1}
  .heatlegend .cap{color:var(--tx3);font-weight:600}
  /* 字模格不加辉光：靠亮度差异隐约显形，混在正常热力痕迹里 */
  .closewrap{display:flex;flex-direction:column;align-items:center;gap:1em}
  .closewrap img{object-fit:contain opacity(.96)}
  .urlchip{position:relative;overflow:hidden;margin-top:.35em;padding:.75em 1.5em;border-radius:999px;color:#fff;font-weight:800;
    background:var(--gr);box-shadow:0 14px 40px -12px rgba(79,141,255,.7);font-variant-numeric:tabular-nums}
  .urlchip i{position:absolute;top:-50%;bottom:-50%;width:26%;left:0;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));
    transform:translate3d(-180%,0,0) skewX(-18deg);will-change:transform;animation:chip 3.4s ease-in-out infinite}
  @keyframes chip{0%{transform:translate3d(-180%,0,0) skewX(-18deg)}55%{transform:translate3d(560%,0,0) skewX(-18deg)}100%{transform:translate3d(560%,0,0) skewX(-18deg)}}
  .segs{width:100%;display:flex;gap:5px;z-index:40}
  .segs i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
  .segs i.done{background:rgba(79,141,255,.75)}
  .segs i b{position:absolute;inset:0;background:var(--gr);transform-origin:left;transform:scaleX(0);border-radius:3px;will-change:transform}
  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90}
  #count i{position:absolute;font-style:normal;font-weight:900;color:var(--acc);opacity:0;animation:cnum 1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes cnum{0%{opacity:0;transform:translate3d(0,0,0) scale(1.5)}22%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
  #pausebd{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);z-index:80;letter-spacing:.18em;
    color:var(--tx2);border:1px solid var(--line);background:rgba(12,16,26,.72);backdrop-filter:blur(8px);
    border-radius:999px;padding:.45em 1.2em;opacity:0;transition:opacity .25s;pointer-events:none}
  #pausebd.on{opacity:1}
</style>
</head>
<body>
<div id="bg"></div>
<div id="sheen"><div class="bar"></div></div>
<div id="stage">
  <div class="topbar">
    <img class="lg" style="width:28px;height:28px" data-logo alt="">
    <b style="font-size:16px">猫卷</b><span class="sp"></span>
    <span class="cut" style="font-size:11px" id="cutlabel">KEYNOTE</span>
  </div>
  <div id="cam">
    <div id="ghost"></div>
    <div id="textcam"></div>
  </div>
  <div class="segs" id="segs"></div>
</div>
<div id="count"></div>
<div id="pausebd">‖ 已暂停 · 空格继续</div>

var Q = location.search;
var FAST = /cut=fast/.test(Q);
var AR = (Q.match(/ar=([\d.]+(?:[:x][\d.]+)?)/) || [])[1] || '9:16';
var pp = AR.replace('x', ':').split(':').map(Number);
var RATIO = (pp[0] / pp[1]) || (9 / 16);
var LAY = RATIO >= 0.98 ? 'land' : 'port';
var SW, SH;
if (LAY === 'port') { SH = 960; SW = Math.round(960 * RATIO); }
else { SW = 1000; SH = Math.round(1000 / RATIO); }
var stage = document.getElementById('stage');
var cam = document.getElementById('cam');
var textcam = document.getElementById('textcam');
var ghost = document.getElementById('ghost');
stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
var U = LAY === 'port' ? SW / 540 : SH / 540;
function fitStage(){
  var s = Math.min(window.innerWidth / SW, window.innerHeight / SH);
  stage.style.transform = 'translate3d(-50%,-50%,0) scale(' + s.toFixed(4) + ')';
}
window.addEventListener('resize', fitStage); fitStage();
document.getElementById('cutlabel').textContent = FAST ? 'SHORT CUT' : 'KEYNOTE';
var CS = 1.28;   /* 全局内容放大系数：填补画面留白 */
function px(base){ return Math.round(base * CS * Math.max(U, .78)); }
/* 巨字自适应：保证不超出画面宽度（数字/字母平均宽约 0.56em） */
function megaPx(text, cap){
  var want = px(cap);
  var stageW = LAY === 'port' ? SW : SW * 0.92;
  var fit = stageW * 0.92 / (String(text).length * 0.56);
  return Math.round(Math.min(want, fit));
}

/* ══════════ 立体运镜引擎（透视相机 + 脏检查） ══════════ */
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }
function lerp(a, b, k){ return a + (b - a) * k; }
var KF = null, camT0 = 0, clock = 0, prevT = performance.now();
var vx=0, vy=0, vz=0, vrx=0, vry=0, wrote='';
function applyCam(){
  var k = 1;
  if(KF){
    var t = KF.dur > 0 ? Math.min(1, (clock - camT0) / KF.dur) : 1;
    k = KF.ease ? KF.ease(t) : easeOutCubic(t);
    vx  = KF.x  ? lerp(KF.x[0],  KF.x[1],  k) : 0;
    vy  = KF.y  ? lerp(KF.y[0],  KF.y[1],  k) : 0;
    vz  = KF.z  ? lerp(KF.z[0],  KF.z[1],  k) : 0;
    vrx = KF.rx ? lerp(KF.rx[0], KF.rx[1], k) : 0;
    vry = KF.ry ? lerp(KF.ry[0], KF.ry[1], k) : 0;
  }
  var key = vx.toFixed(2)+'|'+vy.toFixed(2)+'|'+vz.toFixed(2)+'|'+vrx.toFixed(3)+'|'+vry.toFixed(3);
  if(key === wrote) return;
  wrote = key;
  cam.style.transform = 'translate3d(' + vx.toFixed(2) + 'px,' + vy.toFixed(2) + 'px,' + vz.toFixed(2) +
    'px) rotateX(' + vrx.toFixed(3) + 'deg) rotateY(' + vry.toFixed(3) + 'deg)';
}
(function loop(){
  var t = performance.now(), dt = t - prevT; prevT = t;
  if(!paused) clock += dt;
  applyCam();
  requestAnimationFrame(loop);
})();
function sheen(){

}

      var p = Math.min(1, (performance.now() - segStart) / segDur);
      segFill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
      if(p < 1) requestAnimationFrame(drive);
    }
  })();
  timer = setTimeout(function(){ showBeat((k + 1) % BEATS.length); }, segDur + (FAST ? 220 : 400));
}

function setPaused(v){
  if(paused === v) return;
  paused = v;
  pauseBd.classList.toggle('on', v);
  if(v){ clearTimeout(timer); pausedAt = performance.now(); }
  else {
    segStart += performance.now() - pausedAt;
    var rest = Math.max(300, segDur - (performance.now() - segStart));
    timer = setTimeout(function(){ showBeat((beat + 1) % BEATS.length); }, rest + (FAST ? 220 : 400));
  }
}
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); setPaused(!paused); }
  if(e.key === 'r' || e.key === 'R'){ paused = false; pauseBd.classList.remove('on'); showBeat(0); }
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  if(e.key === 'ArrowRight'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat + 1) % BEATS.length); }
  if(e.key === 'ArrowLeft'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat - 1 + BEATS.length) % BEATS.length); }
});
document.addEventListener('visibilitychange', function(){ setPaused(document.hidden); });

var SKIP = /go=1/.test(Q);
var FROM = parseInt((Q.match(/from=(\d+)/) || [])[1] || '0', 10);
FROM = Math.min(Math.max(FROM, 0), BEATS.length - 1);
(function start(){
  countBox.innerHTML = '';
  if(SKIP){ showBeat(FROM); return; }
  ['3','2','1'].forEach(function(x, i){
    var el = document.createElement('i');
    el.textContent = x;
    el.style.fontSize = px(120) + 'px';
    el.style.animationDelay = (i * (FAST ? .6 : .95)) + 's';
    countBox.appendChild(el);
  });
  setTimeout(function(){ countBox.innerHTML = ''; showBeat(FROM); }, FAST ? 1950 : 2950);
})();
</script>
