<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫卷 · 发布会（本地录屏版）</title>
<!--
  猫卷 · 产品发布会（本地录屏版 v6 · 电影运镜）
  ═══════════════════════════════════════════
  双击即播（file:// 本地协议，零网络；logo 已内嵌单文件）。
  3-2-1 倒计时后自动开播，播完无缝循环。

  画面：明亮舞台 + 巨大排版 + 发丝分隔线 + 渐变标题字。
  运镜：镜头在场景里持续推/拉/摇/移（每拍一条运镜曲线），
        背景柔光反向视差，转场由镜头运动完成，扫光掠过舞台。

  参数：?ar=16:9  比例(默认 9:16)   ?speed=1.15  倍速
        ?from=5   从第 5 拍起循环    ?go=1        跳过倒计时
  快捷键：空格 暂停 · R 重播 · F 全屏 · ←→ 逐拍
-->
<style>
  :root{
    --acc:#2563EB; --acc2:#3B82F6;
    --ink:#0B1220; --ink2:#5A6B85; --ink3:#93A1B8;
    --line:rgba(11,18,32,.10);
    --bg:#F5F7FB;
    --grad:linear-gradient(96deg,#2563EB 0%,#6D5BF6 46%,#06B6D4 100%);
    --m-bg:#F5F7FA; --m-card:#FFFFFF; --m-bd:#E2E8F0; --m-fg:#111827; --m-fg2:#566072; --m-fg3:#8A94A6;
    --m-s2:#EDF1F7; --m-bad:#B91C1C; --m-badbg:#FEE2E2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden;cursor:none;
    font-family:-apple-system,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  /* ── 背景柔光（随镜头反向视差） ── */
  .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;
    transition:transform .2s linear}
  .g1{width:64vmax;height:64vmax;left:-19vmax;top:-25vmax;opacity:.32;
    background:radial-gradient(circle,rgba(37,99,235,.55),transparent 68%)}
  .g2{width:56vmax;height:56vmax;right:-21vmax;bottom:-23vmax;opacity:.26;
    background:radial-gradient(circle,rgba(6,182,212,.5),transparent 68%)}
  /* ── 扫光（每拍掠过舞台） ── */
  #sheen{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
  #sheen i{position:absolute;top:-60%;bottom:-60%;width:36%;left:-48%;
    background:linear-gradient(100deg,transparent,rgba(37,99,235,.13),transparent);
    transform:skewX(-16deg);filter:blur(22px);opacity:0}
  #sheen.go i{animation:sheen 1.6s cubic-bezier(.4,0,.2,1)}
  @keyframes sheen{0%{left:-48%;opacity:0}18%{opacity:1}100%{left:118%;opacity:0}}
  /* ── 舞台 ── */
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    transform-origin:center;display:flex;flex-direction:column;align-items:center;z-index:10}
  .topbar{width:100%;display:flex;align-items:center;gap:11px;z-index:40}
  .topbar .lg{object-fit:contain}
  .topbar b{letter-spacing:.02em}
  .topbar .sp{flex:1}
  .topbar .ver{color:var(--ink2);border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums}
  /* 镜头区：运镜作用于这一层，角标保持不动 */
  #camwrap{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;
    transform-origin:50% 50%;will-change:transform}
  [data-lay="port"] #camwrap{flex-direction:column;gap:4%}
  [data-lay="land"] #camwrap{flex-direction:row;gap:6%}
  /* ── 产品（手机） ── */
  .phonewrap{position:relative;flex:0 0 auto;opacity:0;transform:translateY(26px) scale(.96) rotateY(10deg);
    transform-style:preserve-3d;perspective:1200px;
    transition:opacity .9s ease, transform 1.2s cubic-bezier(.22,1,.36,1)}
  .phonewrap.in{opacity:1;transform:none}
  .phonewrap.floaty{animation:floaty 9s ease-in-out infinite alternate}
  @keyframes floaty{
    from{transform:rotateY(-5.5deg) rotateX(1.4deg) translateY(0)}
    to{transform:rotateY(5.5deg) rotateX(-1.6deg) translateY(-12px)}}
  .phonewrap::after{content:"";position:absolute;left:5%;right:5%;bottom:-7%;height:11%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(11,18,32,.24), transparent 72%);
    filter:blur(11px);z-index:-1;transition:transform 1s ease}
  .phonewrap.floaty::after{transform:scaleX(.94) translateX(2%)}
  .phone{position:relative;border-radius:9.6% / 4.5%;background:#0F1729;
    box-shadow:0 2px 4px rgba(11,18,32,.10), 0 36px 68px -18px rgba(11,18,32,.36), 0 0 0 1px rgba(11,18,32,.07)}
  .scr{position:absolute;border-radius:8%/3.9%;overflow:hidden;background:var(--m-bg);color:var(--m-fg)}
  .notch{position:absolute;top:2.1%;left:50%;transform:translateX(-50%);width:25%;height:2.5%;
    background:#0F1729;border-radius:999px;z-index:40}
  /* ── 屏内通用件（276×613 设计稿） ── */
  .sbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;font-weight:600;color:var(--m-fg)}
  .sbar .r{display:flex;gap:4px;align-items:center}
  .sg{width:14px;height:10px;background:var(--m-fg);clip-path:polygon(0 100%,100% 0,100% 100%);opacity:.9}
  .bat{width:20px;height:10px;border:1.4px solid var(--m-fg);border-radius:3px;position:relative;opacity:.9}
  .bat::before{content:"";position:absolute;inset:1.6px;right:5px;background:var(--m-fg);border-radius:1px}
  .bat::after{content:"";position:absolute;right:-3.4px;top:2.4px;width:2px;height:4px;background:var(--m-fg);border-radius:0 2px 2px 0}
  .appb{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:17px;font-weight:800}
  .appb .sp{flex:1}
  .gear{width:26px;height:26px;border-radius:8px;background:var(--m-s2);display:flex;align-items:center;justify-content:center;color:var(--m-fg2)}
  .prog{height:3px;background:var(--m-s2);margin:0 14px;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
  .body{position:absolute;top:70px;bottom:52px;left:0;right:0;overflow:hidden;padding:10px 14px 0}
  .navb{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--m-card);
    border-top:1px solid var(--m-bd);display:flex;align-items:center;justify-content:space-around;font-size:10.5px;color:var(--m-fg3)}
  .navb .t{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
  .navb .t.on{color:var(--acc);font-weight:700}
  .navb .pip{width:26px;height:3px;border-radius:2px;background:transparent;margin-top:1px}
  .navb .t.on .pip{background:var(--acc)}
  .card{background:var(--m-card);border:1px solid var(--m-bd);border-radius:14px;padding:13px}
  .hero{background:linear-gradient(135deg,#2E6BFF,#1D4ED8);border-radius:16px;color:#fff;padding:16px 16px 14px;box-shadow:0 10px 24px rgba(37,99,235,.35)}
  .hero .hi{font-size:16px;font-weight:800}
  .hero .hr{display:flex;align-items:center;gap:10px;margin-top:12px}
  .hero .lg2{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff}
  .hero .ht{font-size:14px;font-weight:800}
  .hero .hq{font-size:11.5px;opacity:.85;margin-top:1px}
  .sech{font-size:13.5px;font-weight:800;margin:14px 2px 8px;color:var(--m-fg)}
  .qa{display:flex;flex-direction:column;gap:9px}
  .qi{display:flex;align-items:center;gap:10px;background:var(--m-card);border:1px solid var(--m-bd);border-radius:13px;padding:11px 12px}
  .qi.hl{border:1.5px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 4px 16px rgba(37,99,235,.16)}
  .qi .ic{width:36px;height:36px;border-radius:10px;background:rgba(37,99,235,.1);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .qi .tx{flex:1;min-width:0}
  .qi .tx b{font-size:13.5px;display:block}
  .qi .tx em{font-style:normal;font-size:11px;color:var(--m-fg2);display:block;margin-top:2px;line-height:1.45}
  .qi .go{font-size:12px;font-weight:700;color:var(--m-fg3)}
  .qi .btn{background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;border-radius:11px;padding:7px 14px}
  .qtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--acc);background:#E4EDFE;border-radius:7px;padding:3px 8px}
  .qmeta{font-size:10px;color:var(--m-fg3);margin-left:7px}
  .stem{font-size:14.5px;line-height:1.6;margin-top:8px;font-weight:600}
  .tf{display:flex;gap:10px;margin-top:12px}
  .tf .b{flex:1;background:var(--m-card);border:1.5px solid #16A34A;border-radius:13px;padding:14px 0;text-align:center;font-size:15px;font-weight:800;color:#15803D}
  .tf .b.x{border-color:#DC2626;color:#B91C1C}
  .fb{margin-top:11px;background:var(--m-badbg);border:1.5px solid #DC2626;border-radius:14px;padding:12px 13px;opacity:0;transform:translateY(10px);transition:all .45s cubic-bezier(.22,1,.36,1)}
  .fb.on{opacity:1;transform:none}
  .fb .tt{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--m-bad)}
  .fb .rr{font-size:12.5px;margin-top:6px;color:var(--m-fg2)}
  .fb .rr b{color:#15803D}
  .aih{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--acc)}
  .aih .sp{flex:1}
  .aih .mini{font-size:10px;font-weight:600;color:var(--m-fg3);background:var(--m-s2);padding:3px 8px;border-radius:999px}
  .atext{font-size:12.8px;line-height:1.75;color:var(--m-fg);margin-top:8px}
  .atext .hl{color:var(--acc);font-weight:700}
  .caret{display:inline-block;width:2px;height:14px;background:var(--acc);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .askrow{display:flex;align-items:center;gap:10px;background:var(--m-card);border:1px solid var(--m-bd);border-radius:13px;padding:11px 12px;margin-top:10px}
  .askrow .aic{width:32px;height:32px;border-radius:9px;background:rgba(37,99,235,.1);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .askrow .tx b{font-size:13px;display:block}
  .askrow .tx em{font-style:normal;font-size:11px;color:var(--m-fg2)}
  .heat{display:grid;grid-template-columns:repeat(13,1fr);gap:3.5px;margin-top:10px}
  .heat i{aspect-ratio:1;border-radius:3px;background:#E7ECF4}
  .heat i.l1{background:#BFD5FA}.heat i.l2{background:#6E9EF6}.heat i.l3{background:#2563EB}
  .trio{display:flex;gap:9px;margin-top:10px}
  .trio>div{flex:1;background:var(--m-card);border:1px solid var(--m-bd);border-radius:12px;text-align:center;padding:10px 4px}
  .trio b{font-size:15px;display:block}
  .trio em{font-style:normal;font-size:9.5px;color:var(--m-fg2)}
  .toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-16px);opacity:0;
    background:rgba(17,24,39,.92);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;
    white-space:nowrap;transition:all .4s cubic-bezier(.22,1,.36,1);box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:5}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .tap{position:absolute;width:46px;height:46px;border-radius:50%;pointer-events:none;z-index:9;
    border:2.5px solid rgba(37,99,235,.85);background:rgba(37,99,235,.18);transform:translate(-50%,-50%) scale(.4);opacity:0}
  .tap.on{animation:tap 1.15s ease-out infinite}
  @keyframes tap{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}25%{opacity:1}70%{opacity:.9;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
  .layer{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
  .layer.on{opacity:1;pointer-events:auto}
  .fitbox{position:absolute;top:0;left:0;width:276px;height:613px;transform-origin:top left}
  /* ── 说明区块 ── */
  .speak{display:flex;flex-direction:column;text-align:left}
  [data-lay="port"] .speak{width:100%}
  [data-lay="land"] .speak{flex:0 1 46%}
  .speak .kicker{font-weight:800;letter-spacing:.34em;color:var(--acc);text-transform:uppercase}
  .speak h1{font-weight:850;line-height:1.16;letter-spacing:-.015em;margin-top:.5em}
  .speak h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .speak .sub{color:var(--ink2);line-height:1.65;margin-top:.8em}
  .speak .rows{margin-top:1.15em}
  .speak .row{display:flex;align-items:flex-start;gap:14px;padding:.72em 0;border-top:1px solid var(--line)}
  .speak .row:last-child{border-bottom:1px solid var(--line)}
  .speak .row b{font-weight:700}
  .speak .row .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:0 0 auto;transform:translateY(7px)}
  /* ── 场景（大屏） ── */
  .scene{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(1.03) translateY(10px);pointer-events:none;
    transition:opacity .9s ease, transform 1.2s cubic-bezier(.22,1,.36,1)}
  .scene.in{opacity:1;transform:none;pointer-events:auto}
  .scene.out{opacity:0;transform:scale(.975) translateY(-8px)}
  .scenebox{width:84%;max-height:92%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;text-align:center}
  .kick{font-weight:800;letter-spacing:.4em;text-indent:.4em;color:var(--acc);text-transform:uppercase}
  .hero-line{font-weight:850;line-height:1.1;letter-spacing:-.02em}
  .hero-line .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mega{font-weight:900;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--ink2);line-height:1.7}
  /* 景深入场：从纵深翻入（配合运镜） */
  .rise{opacity:0;transform:perspective(1000px) translateY(22px) translateZ(-70px) rotateX(7deg);
    transition:opacity .85s ease, transform 1.05s cubic-bezier(.22,1,.36,1)}
  .rise.in{opacity:1;transform:none}
  .pain{width:100%;display:flex;align-items:flex-start;gap:1.1em;text-align:left;padding:1em 0;border-top:1px solid var(--line)}
  .pain:last-of-type{border-bottom:1px solid var(--line)}
  .pain .no{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;min-width:2.2em}
  .pain .tx b{display:block;font-weight:750}
  .pain .tx em{font-style:normal;color:var(--ink2);line-height:1.55}
  .tl{width:92%;text-align:left}
  .tl .lrow{display:flex;align-items:flex-start;gap:1.2em;padding:.9em 0;border-top:1px solid var(--line)}
  .tl .lrow:last-child{border-bottom:1px solid var(--line)}
  .tl .when{min-width:6.4em;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.5em}
  .tl .when .pt{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 auto}
  .tl .what b{display:block;font-weight:750}
  .tl .what em{font-style:normal;color:var(--ink2);line-height:1.5}
  .tl .what img{height:1.35em;vertical-align:-.32em;margin-right:.4em}
  .statrow{width:88%;text-align:left}
  .srow{display:flex;align-items:baseline;gap:1.1em;padding:1.05em 0;border-top:1px solid var(--line)}
  .srow:last-child{border-bottom:1px solid var(--line)}
  .srow .n{min-width:4.6em;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .srow .n s{text-decoration:none}
  .srow .lb{color:var(--ink2)}
  .closewrap{display:flex;flex-direction:column;align-items:center;gap:1em}
  .closewrap img{object-fit:contain}
  .urlchip{position:relative;overflow:hidden;margin-top:.3em;padding:.75em 1.5em;border-radius:999px;color:#fff;font-weight:800;
    background:var(--grad);box-shadow:0 12px 30px -10px rgba(37,99,235,.6);font-variant-numeric:tabular-nums}
  .urlchip::after{content:"";position:absolute;top:-50%;bottom:-50%;width:30%;left:-40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);
    animation:chip 3.2s ease-in-out infinite}
  @keyframes chip{0%{left:-40%}55%{left:120%}100%{left:120%}}
  .segs{width:100%;display:flex;gap:5px;z-index:40}
  .segs i{flex:1;height:3px;border-radius:3px;background:rgba(11,18,32,.10);overflow:hidden;position:relative}
  .segs i.done{background:var(--acc2)}
  .segs i b{position:absolute;inset:0;background:var(--grad);transform-origin:left;transform:scaleX(0);border-radius:3px}
  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90}
  #count i{position:absolute;font-style:normal;font-weight:900;color:var(--acc);opacity:0;animation:cnum 1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes cnum{0%{opacity:0;transform:scale(1.6);filter:blur(10px)}22%{opacity:1;transform:scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
  #pausebd{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);z-index:80;font-size:13px;letter-spacing:.18em;
    color:var(--ink2);border:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
    border-radius:999px;padding:.45em 1.2em;opacity:0;transition:opacity .25s;pointer-events:none}
  #pausebd.on{opacity:1}
</style>
</head>
<body>
<div class="glow g1" id="glow1"></div><div class="glow g2" id="glow2"></div>
<div id="sheen"><i></i></div>
<div id="stage">
  <div class="topbar">
    <img class="lg" style="width:30px;height:30px" data-logo alt="">
    <b style="font-size:17px">猫卷</b><span class="sp"></span>
    <span class="ver" style="font-size:12px;padding:4px 11px" id="ver">v1.28.1</span>
  </div>
  <div id="camwrap">
    <div class="phonewrap" id="phonewrap">
      <div class="phone" id="phone">
        <div class="scr" id="scr">
          <div class="toast" id="toast">示例题库导入完成 · 共 10 道题</div>
          <div class="tap" id="tap"></div>
        </div>
        <div class="notch"></div>
      </div>
    </div>
  </div>
  <div class="segs" id="segs"></div>
</div>
<div id="count"></div>

var CAM_KF = null, camStart = 0;
var clockNow = 0, clockLast = performance.now();
var glow1 = document.getElementById('glow1'), glow2 = document.getElementById('glow2');
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

    var t = CAM_KF.dur > 0 ? Math.min(1, (clockNow - camStart) / CAM_KF.dur) : 1;
    k = CAM_KF.ease ? CAM_KF.ease(t) : easeOutCubic(t);
    camState.x   = CAM_KF.x  ? lerp(CAM_KF.x[0],   CAM_KF.x[1],   k) : 0;
    camState.y   = CAM_KF.y  ? lerp(CAM_KF.y[0],   CAM_KF.y[1],   k) : 0;
    camState.s   = CAM_KF.s  ? lerp(CAM_KF.s[0],   CAM_KF.s[1],   k) : 1;
    camState.rot = CAM_KF.rot? lerp(CAM_KF.rot[0], CAM_KF.rot[1], k) : 0;
  }
  camwrap.style.transform = 'translate(' + camState.x.toFixed(2) + 'px,' + camState.y.toFixed(2) +
    'px) scale(' + camState.s.toFixed(4) + ') rotate(' + camState.rot.toFixed(3) + 'deg)';
  /* 背景柔光反向视差（幅度小，制造纵深） */
  var gx = -camState.x * 0.42, gy = -camState.y * 0.42, gs = 1 + (camState.s - 1) * -0.5;
  glow1.style.transform = 'translate(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px) scale(' + gs.toFixed(3) + ')';

    if(f.type){
      var at = l.querySelector('#ai-typed');
      if(at) TYPE_TIMERS.push(setTimeout(function(){ typeInto(at, AI_TEXT, b.ms * 0.6 / speed); }, 500));
    }
    if(f.chat){
      var a0 = l.querySelector('#ai-typed');
      if(a0) a0.innerHTML = renderAi(AI_TEXT);
      var bx = l.querySelector('#bubs');
      if(bx) playBubs(bx);
    }
    if(f.pan){
      var body = l.querySelector('.body');
      if(body){
        body.style.transition = 'transform 5.2s cubic-bezier(.4,.1,.2,1)';
        body.style.transformOrigin = 'top center';
        TYPE_TIMERS.push(setTimeout(function(){ body.style.transform = 'scale(1.14) translateY(-14px)'; }, 700));
      }
    }
    if(f.tap) TYPE_TIMERS.push(setTimeout(function(){ showTap(f.tap); }, 520));
    if(f.revealFb) TYPE_TIMERS.push(setTimeout(function(){
      var fb = l.querySelector('.fb'); if(fb) fb.classList.add('on');
    }, 2000));
  } else {
    camwrap.style.justifyContent = 'center';
    phonewrap.classList.remove('in', 'floaty');
  }

  if(b.kind === 'hero'){
    mountScene('<img class="rise" src="' + LOGO + '" style="height:' + px(158) + 'px;object-fit:contain" alt="">' +
      '<div class="rise hero-line" style="font-size:' + px(LAY === 'port' ? 58 : 64) + 'px">' + esc(b.h) + '</div>' +
      '<div class="rise lede" style="font-size:' + px(16) + 'px">' + esc(b.sub) + '</div>' +
      '<div class="rise" style="margin-top:.7em;font-size:' + px(12.5) + 'px;color:var(--ink3);letter-spacing:.2em">' + esc(b.foot) + '</div>');
  }
  else if(b.kind === 'why'){
    mountScene('<div class="rise kick" style="font-size:' + px(12.5) + 'px">' + esc(b.kick) + '</div>' +
      '<div class="rise hero-line" style="font-size:' + px(LAY === 'port' ? 30 : 36) + 'px;margin-bottom:.4em">' + em(b.h) + '</div>' +
      b.pains.map(function(p){
        return '<div class="pain rise"><span class="no" style="font-size:' + px(15) + 'px">' + esc(p[0]) + '</span>' +
          '<div class="tx"><b style="font-size:' + px(16.5) + 'px">' + esc(p[1]) + '</b>' +
          '<em style="font-size:' + px(13.5) + 'px">' + esc(p[2]) + '</em></div></div>';
      }).join('') +
      '<div class="rise lede" style="margin-top:1.1em;font-size:' + px(15) + 'px">' + esc(b.foot) + '</div>');
  }
  else if(b.kind === 'origin'){
    mountScene('<div class="rise kick" style="font-size:' + px(12.5) + 'px">' + esc(b.kick) + '</div>' +
      '<div class="rise hero-line" style="font-size:' + px(LAY === 'port' ? 32 : 38) + 'px;margin-bottom:.5em">' + em(b.h) + '</div>' +
      b.rows.map(function(r){
        return '<div class="pain rise"><span class="no" style="font-size:' + px(15) + 'px">＋</span>' +
          '<div class="tx"><b style="font-size:' + px(16.5) + 'px">' + esc(r[0]) + '</b>' +
          '<em style="font-size:' + px(13.5) + 'px">' + esc(r[1]) + '</em></div></div>';
      }).join('') +
      '<div class="rise lede" style="margin-top:.9em;font-size:' + px(14) + 'px">' + esc(b.foot) + '</div>');
  }
  else if(b.kind === 'timeline'){
    mountScene('<div class="rise kick" style="font-size:' + px(12.5) + 'px;margin-bottom:.4em">' + esc(b.kick) + '</div>' +
      '<div class="tl">' + b.items.map(function(it){
        return '<div class="lrow rise"><div class="when" style="font-size:' + px(14) + 'px"><span class="pt"></span>' + esc(it[0]) + '</div>' +
          '<div class="what"><b style="font-size:' + px(15.5) + 'px">' + esc(it[1]) + '</b>' +
          '<em style="font-size:' + px(13) + 'px">' + (it[3] ? '<img src="' + LOGO + '" alt="">' : '') + esc(it[2]) + '</em></div></div>';
      }).join('') + '</div>');
  }
  else if(b.kind === 'today'){
    mountScene('<div class="rise kick" style="font-size:' + px(12.5) + 'px">' + esc(b.kick) + '</div>' +
      '<div class="rise mega" style="font-size:' + px(LAY === 'port' ? 82 : 96) + 'px;margin:.12em 0">' + esc(b.mega) + '</div>' +
      '<div class="rise lede" style="font-size:' + px(15) + 'px;margin-top:.4em">' + esc(b.sub) + '</div>');
  }
  else if(b.kind === 'stats'){
    mountScene('<div class="rise kick" style="font-size:' + px(12.5) + 'px">' + esc(b.kick) + '</div>' +
      '<div class="rise hero-line" style="font-size:' + px(LAY === 'port' ? 26 : 32) + 'px;margin-bottom:.5em">' + em(b.h) + '</div>' +
      '<div class="statrow">' + b.stats.map(function(s){
        return '<div class="srow rise"><div class="n" style="font-size:' + px(38) + 'px"><span data-n="' + s[0] + '">0</span><s>' + esc(s[1]) + '</s></div>' +
          '<div class="lb" style="font-size:' + px(15) + 'px">' + esc(s[2]) + '</div></div>';
      }).join('') + '</div>');
  }
  else if(b.kind === 'close'){
    mountScene('<div class="closewrap">' +
      '<img class="rise" src="' + LOGO + '" style="height:' + px(72) + 'px" alt="">' +
      '<div class="rise hero-line" style="font-size:' + px(LAY === 'port' ? 30 : 34) + 'px">' + esc(b.h) + '</div>' +
      '<div class="rise lede" style="font-size:' + px(15) + 'px">' + esc(b.sub) + '</div>' +
      '<div class="rise urlchip" style="font-size:' + px(14) + 'px">' + esc(b.url) + '</div>' +
      '<div class="rise" style="font-size:' + px(14) + 'px;color:var(--ink2);font-weight:650">' + esc(b.foot) + '</div></div>');
  }

  segFill = document.createElement('b');
  segEls[k].appendChild(segFill);
  segStart = performance.now();
  (function drive(){
    if(segFill && segFill.parentNode && !paused){
      var p = Math.min(1, (performance.now() - segStart) / segDur);
      segFill.style.transform = 'scaleX(' + p + ')';
      if(p < 1) requestAnimationFrame(drive);
    }
  })();
  timer = setTimeout(function(){ showBeat((k + 1) % BEATS.length); }, segDur + 420);
}

function setPaused(v){
  if(paused === v) return;
  paused = v;
  pauseBd.classList.toggle('on', v);
  if(v){ clearTimeout(timer); pausedAt = performance.now(); }
  else {
    segStart += performance.now() - pausedAt;
    var rest = Math.max(320, segDur - (performance.now() - segStart));
    timer = setTimeout(function(){ showBeat((beat + 1) % BEATS.length); }, rest + 420);
  }
}
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); setPaused(!paused); }
  if(e.key === 'r' || e.key === 'R'){ paused = false; pauseBd.classList.remove('on'); showBeat(0); }
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  if(e.key === 'ArrowRight'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat + 1) % BEATS.length); }
  if(e.key === 'ArrowLeft'){ paused = false; pauseBd.classList.remove('on'); showBeat((beat - 1 + BEATS.length) % BEATS.length); }
});
document.addEventListener('visibilitychange', function(){ setPaused(document.hidden); });

var SKIP = /go=1/.test(location.search);
var FROM = parseInt((location.search.match(/from=(\d+)/) || [])[1] || '0', 10);
FROM = Math.min(Math.max(FROM, 0), BEATS.length - 1);
function start(){
  countBox.innerHTML = '';
  if(SKIP){ showBeat(FROM); return; }
  ['3', '2', '1'].forEach(function(n, i){
    var el = document.createElement('i');
    el.textContent = n;
    el.style.fontSize = px(120) + 'px';
    el.style.animationDelay = (i * 0.95) + 's';
    countBox.appendChild(el);
  });
  setTimeout(function(){ countBox.innerHTML = ''; showBeat(FROM); }, 2950);
}
start();
</script>
</body>
</html>
