org.gradle.jvmargs=-Xmx4G --add-exports=java.base/sun.nio.ch=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
android.experimental.disableCompileSdkChecks=true
# Fail fast on unreachable hosts (dl.google.com is blocked on this network)
org.gradle.internal.http.connectionTimeout=5000
org.gradle.internal.http.socketTimeout=10000
