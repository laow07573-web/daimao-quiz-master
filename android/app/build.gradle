def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ── ABI 过滤：把 Flutter 的 --target-platform 映射成 ndk.abiFilters ──────────
// 为什么需要这一步：Flutter 的 --target-platform 只约束它自己的引擎库。
// flutter.groovy 里仅在 --split-per-abi 时才设置 splits.abi，**从不设置
// ndk.abiFilters**，于是插件 AAR 内自带的原生库会按全部 ABI 打进 APK。
// 实测（2026-10-07）：`--target-platform android-arm64` 产出的包里，
// libflutter.so / libapp.so 确实只有 arm64，但 pdfium 与 ML Kit OCR 仍带
// x86 / x86_64 / armeabi-v7a 三份，白装约 19MB。
//
// 这里复用 Flutter 已经传入的同一个 target-platform 属性：构建哪些架构，
// 就只装哪些架构。未传该属性时 requestedAbis 为空，行为与原来完全一致。
def platformToAbi = [
    'android-arm'  : 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x86'  : 'x86',
    'android-x64'  : 'x86_64',
]
def requestedPlatforms = project.findProperty('target-platform')
def requestedAbis = requestedPlatforms == null
    ? []
    : requestedPlatforms.split(',').collect { platformToAbi[it.trim()] }.findAll { it != null }

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.flashcard.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // flutter_local_notifications 需要 core library desugaring
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "com.flashcard.app"
        // flutter_foreground_task 要求 minSdk >= 23
        minSdk 23
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // 见文件顶部说明：只对本次真正要构建的架构打包原生库。
        if (!requestedAbis.isEmpty()) {
            ndk {
                abiFilters.addAll(requestedAbis)
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        // 仅当 debug keystore 口令已知时才覆盖默认 debug 签名
        if (keystoreProperties['debugStoreFile']) {
            debug {
                keyAlias keystoreProperties['debugKeyAlias']
                keyPassword keystoreProperties['debugKeyPassword']
                storeFile file(keystoreProperties['debugStoreFile'])
                storePassword keystoreProperties['debugStorePassword']
            }
        }
    }

    buildTypes {
        release {
            // v1.0.2 设计审查修复：正式构建改用正式签名（防篡改校验真实生效）。
            // 注意：与历史 debug 证书(540320cd)不是同一把钥匙，
            // 旧版本安装的设备需卸载后重装一次。
            signingConfig signingConfigs.release
            // R8 规则：ML Kit 未引入的语种包（见 proguard-rules.pro）。
            // 只追加一个文件，不覆盖 AGP 自带的默认规则集。
            proguardFile 'proguard-rules.pro'
        }
        profile {
            // 2026-10-09 性能测量需要：profile 包默认用 debug 签名，而
            // TamperCheck 只在 kDebugMode 跳过校验 —— 于是 profile 包一启动就
            // 被判「安全警告」停在告警页，界面完全静止、拿不到任何帧数据
            // （实测 40 秒只有 4 帧、全是启动帧）。
            // 让 profile 也走正式签名，测量包才能真实跑起来；release 的保护
            // 逻辑一点没动，只是多给开发者构建一种可用签名。
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // 端上 OCR 的中文模型。google_mlkit_text_recognition 只把各语种包声明为
    // compileOnly，必须由 App 自己引入用到的语种——漏了它有两个后果：
    // ① 运行时 NoClassDefFoundError，被 OcrService 的 catch 吞掉 → OCR 静默失效；
    // ② R8 报 Missing classes 直接让 release 构建失败（实测 2026-10-01）。
    // 用 bundled 版（不是 play-services-mlkit-*）：模型随包走，离线可用、免 Key。
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
