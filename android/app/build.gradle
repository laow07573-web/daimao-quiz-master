def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.flashcard.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // flutter_local_notifications 需要 core library desugaring
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "com.flashcard.app"
        // flutter_foreground_task 要求 minSdk >= 23
        minSdk 23
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        // 仅当 debug keystore 口令已知时才覆盖默认 debug 签名
        if (keystoreProperties['debugStoreFile']) {
            debug {
                keyAlias keystoreProperties['debugKeyAlias']
                keyPassword keystoreProperties['debugKeyPassword']
                storeFile file(keystoreProperties['debugStoreFile'])
                storePassword keystoreProperties['debugStorePassword']
            }
        }
    }

    buildTypes {
        release {
            // v1.0.2 设计审查修复：正式构建改用正式签名（防篡改校验真实生效）。
            // 注意：与历史 debug 证书(540320cd)不是同一把钥匙，
            // 旧版本安装的设备需卸载后重装一次。
            signingConfig signingConfigs.release
            // R8 规则：ML Kit 未引入的语种包（见 proguard-rules.pro）。
            // 只追加一个文件，不覆盖 AGP 自带的默认规则集。
            proguardFile 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // 端上 OCR 的中文模型。google_mlkit_text_recognition 只把各语种包声明为
    // compileOnly，必须由 App 自己引入用到的语种——漏了它有两个后果：
    // ① 运行时 NoClassDefFoundError，被 OcrService 的 catch 吞掉 → OCR 静默失效；
    // ② R8 报 Missing classes 直接让 release 构建失败（实测 2026-10-01）。
    // 用 bundled 版（不是 play-services-mlkit-*）：模型随包走，离线可用、免 Key。
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
