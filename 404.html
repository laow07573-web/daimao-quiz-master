<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 猫卷</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#070A14;--tx:#EEF2FA;--tx2:#9AA6BF;--tx3:#6B7794;--c1:#2563EB;--c4:#5B9BFF}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--bg);color:var(--tx);text-align:center;
  font-family:"MiSans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:440px}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 22px;display:block;
  box-shadow:0 12px 30px rgba(0,0,0,.45)}
.code{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--c1),var(--c4));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:20px;font-weight:750;margin:12px 0 8px}
p{font-size:14.5px;color:var(--tx2);margin-bottom:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:13px;
  font-size:15px;font-weight:650;color:#fff;text-decoration:none;
  background:linear-gradient(135deg,var(--c1),var(--c4));
  box-shadow:0 10px 30px rgba(37,99,235,.4);transition:.26s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(37,99,235,.55)}
.tip{margin-top:20px;font-size:12.5px;color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/logo.png" alt="猫卷">
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>链接可能已经失效，或者地址输错了。回到首页看看猫卷能做什么吧。</p>
  <a class="btn" href="./">← 返回首页</a>
  <div class="tip">猫卷 · 本地优先的开源 AI 备考刷题工具</div>
</div>
</body>
</html>
